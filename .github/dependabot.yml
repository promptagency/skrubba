# Dependabot: a monthly pull request for new versions, against the test branch
# dev, which runs the checks and gets a Cloudflare preview. Never merge on
# autopilot: main is production, and dev reaches it at the next release. Before
# merging, see "Updating dependencies" in docs/DEPLOY.md (maskera changes
# detection; onnxruntime-node needs its allowScripts entry bumped; the runtime
# packages change the served files). GitHub reads this file from main, so a
# change here takes effect at the next release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Types for the Node we run (24, in .node-version and the workflow).
      # Remove this when moving to a newer Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # react and react-dom must always be the same version. First, so the
      # @types packages land here and not in dev-tools.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Build and test tools in one pull request.
      dev-tools:
        dependency-type: development
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    labels: [dependencies]
