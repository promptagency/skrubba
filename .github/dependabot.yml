# Dependabot: a monthly pull request for new versions, which runs the checks
# and gets a Cloudflare preview. Never merge on autopilot: a merge to main
# deploys straight to production. Before merging, see "Updating dependencies"
# in docs/DEPLOY.md (maskera changes detection; onnxruntime-node needs its
# allowScripts entry bumped; the runtime packages change the served files).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Types for the Node we run (24, in .node-version and the workflow).
      # Remove this when moving to a newer Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # react and react-dom must always be the same version. First, so the
      # @types packages land here and not in dev-tools.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Build and test tools in one pull request.
      dev-tools:
        dependency-type: development
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
