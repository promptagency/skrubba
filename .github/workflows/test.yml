# Three levels:
#
#   checks   every push to main and every pull request (Dependabot's too):
#            type check and unit tests, the real-model tests included. A few
#            minutes.
#   browser  the full Playwright suite in Chromium, Firefox and WebKit, against
#            a production build. Runs for release tags (v*) and when started by
#            hand (Actions → Tests → Run workflow). Run it locally before that.
#   release  for a v* tag, once both have passed: the GitHub release page,
#            with that version's notes from CHANGELOG.md.
#
# Pushes that only touch Markdown or docs/ run nothing. The pinned model and
# Playwright's browsers are cached, so a normal run downloads neither.
name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # onnxruntime-node's install script, which the model tests need, is
      # approved in package.json (allowScripts).
      - run: npm ci

      # Raw model files, sha256-checked by fetch-model. The key follows the
      # pinned revision in src/config.ts.
      - uses: actions/cache@v6
        with:
          path: .cache/model-src
          key: model-${{ hashFiles('src/config.ts') }}

      - name: Type check (fetches the model if not cached)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  browser:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/cache@v6
        with:
          path: .cache/model-src
          key: model-${{ hashFiles('src/config.ts') }}

      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install test browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install test browsers' system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Browser tests (Chromium, Firefox, WebKit)
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Plain Node runs the TypeScript script; nothing to install.
      - name: Release page from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.ts "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Skrubba ${GITHUB_REF_NAME#v}" --notes-file notes.md
