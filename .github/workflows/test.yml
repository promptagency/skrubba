# Type check, unit tests and browser tests on every push to main and every
# pull request. The pinned model and Playwright's browsers are cached, so a
# normal run downloads neither.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Raw model files, sha256-checked by fetch-model. The key follows the
      # pinned revision in src/config.ts.
      - uses: actions/cache@v6
        with:
          path: .cache/model-src
          key: model-${{ hashFiles('src/config.ts') }}

      - name: Type check (fetches the model if not cached)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install test browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install test browsers' system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Browser tests (Chromium, Firefox, WebKit)
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
